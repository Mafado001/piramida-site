<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — Пирамида</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/site.css" />
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <a class="logo" href="index.html">ПИРА<span>МИДА</span></a>
      <nav aria-label="Основное меню">
        <ul>
          <li><a href="projects.html">Проекты</a></li>
          <li><a href="index.html#about">О компании</a></li>
          <li><a href="index.html#contact">Контакты</a></li>
        </ul>
      </nav>
      <div class="header-cta">
        <a class="btn btn-ghost" href="login.html">Войти</a>
        <a class="btn btn-ghost" href="register.html" aria-current="page">Регистрация</a>
        <a class="btn btn-primary" href="request.html">Заявка</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="wrap">
      <div class="auth-card">
        <h1>Регистрация</h1>
        <p class="auth-card-lead">Создайте аккаунт для личного кабинета.</p>

        <form id="form-register" class="auth-form" novalidate>
          <label class="auth-field">
            <span>Имя</span>
            <input type="text" name="name" autocomplete="name" required minlength="2" />
          </label>
          <label class="auth-field">
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label class="auth-field">
            <span>Пароль</span>
            <input type="password" name="password" autocomplete="new-password" required minlength="6" />
          </label>
          <label class="auth-field">
            <span>Повторите пароль</span>
            <input type="password" name="passwordConfirm" autocomplete="new-password" required minlength="6" />
          </label>
          <p id="auth-message" class="auth-msg" hidden></p>
          <button type="submit" class="btn btn-primary auth-submit">Создать аккаунт</button>
        </form>

        <p class="auth-switch">
          Уже есть аккаунт? <a href="login.html">Войти</a>
        </p>
        <p class="auth-switch">
          <a href="index.html">← На главную</a>
        </p>
      </div>
    </div>
  </main>

  <script src="./js/auth.js"></script>
</body>
</html>
